{% extends 'base.html' %}

{% block page_title %}Thank You{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'website:home' %}">
            {{ site_settings.academy_name|default:"Chess Academy" }}
        </a>
    </div>
</nav>

<div class="container py-5 text-center" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div>
        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
        <h1 class="mt-4 mb-3">Thank You!</h1>
        <p class="lead text-muted mb-4">Your enquiry has been successfully submitted. We will get back to you shortly.</p>
        <a href="{% url 'website:home' %}" class="btn btn-primary">Return to Home</a>
    </div>
</div>
{% endblock %}
