{% extends "base.html" %}

{% block body_class %}login-page{% endblock %}

{% block body %}
<div class="login-card fade-in">
    <div class="text-center mb-4">
        <div style="font-size: 48px; margin-bottom: 8px;">♔</div>
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to your account</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2" role="alert">
        <small>Invalid username or password. Please try again.</small>
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">Sign In</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'website:home' %}" class="text-muted text-decoration-none small">
            <i class="bi bi-arrow-left me-1"></i>Back to website
        </a>
    </div>
</div>
{% endblock %}
