{% extends "base_portal.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-shield-lock fs-1 text-muted"></i>
    <h4 class="mt-3">No Access</h4>
    <p class="text-muted">Your account is not linked to any student or parent profile. Please contact your coach.</p>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit" class="btn btn-primary">Log out</button></form>
</div>
{% endblock %}
