{% extends "base_admin.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold">{{ title }}</span>
                <a href="{{ back_url }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Invoice</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const feePlanSelect = document.getElementById('id_fee_plan');
    if (feePlanSelect) {
        feePlanSelect.addEventListener('change', function() {
            const amounts = { 
                {% for plan in fee_plans %}
                "{{ plan.id }}": {{ plan.amount }},
                {% endfor %} 
            };
            const amount = amounts[this.value];
            if (amount) {
                document.getElementById('id_amount').value = amount;
            }
        });
    }
});
</script>
{% endblock %}
